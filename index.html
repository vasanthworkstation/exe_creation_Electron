<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            padding: 15px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .form-section {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4facfe;
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #51cf66 0%, #40c057 100%);
        }

        .tasks-section {
            padding: 30px;
        }

        .task-item {
            background: #f8f9fa;
            margin-bottom: 15px;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4facfe;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .task-item.completed {
            opacity: 0.7;
            border-left-color: #51cf66;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
        }

        .task-title {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .task-description {
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .task-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .task-actions button {
            padding: 8px 16px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .form-section, .tasks-section {
                padding: 20px;
            }
            
            .task-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Task Manager</h1>
            <p>Electron + Python Demo App</p>
        </div>

        <div id="connectionStatus" class="status disconnected">
            🔴 Connecting to backend...
        </div>

        <div class="form-section">
            <h2>Add New Task</h2>
            <div id="message"></div>
            
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title *</label>
                    <input type="text" id="taskTitle" required placeholder="Enter task title">
                </div>
                
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="3" placeholder="Enter task description (optional)"></textarea>
                </div>
                
                <button type="submit" class="btn">Add Task</button>
            </form>
        </div>

        <div class="tasks-section">
            <h2>Your Tasks</h2>
            <div id="tasksList">
                <div class="loading">Loading tasks...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        let isConnected = false;

        // DOM elements
        const connectionStatus = document.getElementById('connectionStatus');
        const taskForm = document.getElementById('taskForm');
        const taskTitle = document.getElementById('taskTitle');
        const taskDescription = document.getElementById('taskDescription');
        const tasksList = document.getElementById('tasksList');
        const messageDiv = document.getElementById('message');

        // Check backend connection
        async function checkConnection() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    isConnected = true;
                    connectionStatus.className = 'status connected';
                    connectionStatus.innerHTML = '🟢 Connected to Python backend';
                    loadTasks();
                } else {
                    throw new Error('Backend not responding');
                }
            } catch (error) {
                isConnected = false;
                connectionStatus.className = 'status disconnected';
                connectionStatus.innerHTML = '🔴 Backend disconnected - Please ensure Python server is running';
                
                tasksList.innerHTML = '<div class="error">Cannot connect to backend. Please start the Python server.</div>';
                
                // Retry connection after 3 seconds
                setTimeout(checkConnection, 3000);
            }
        }

        // Show message to user
        function showMessage(message, type = 'success') {
            messageDiv.innerHTML = `<div class="${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 3000);
        }

        // Load all tasks
        async function loadTasks() {
            if (!isConnected) return;
            
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                const data = await response.json();
                
                if (response.ok) {
                    displayTasks(data.tasks);
                } else {
                    throw new Error(data.error || 'Failed to load tasks');
                }
            } catch (error) {
                tasksList.innerHTML = `<div class="error">Error loading tasks: ${error.message}</div>`;
            }
        }

        // Display tasks in the DOM
        function displayTasks(tasks) {
            if (tasks.length === 0) {
                tasksList.innerHTML = '<div class="loading">No tasks yet. Add your first task above!</div>';
                return;
            }

            tasksList.innerHTML = tasks.map(task => `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <div class="task-title">${escapeHtml(task.title)}</div>
                    <div class="task-description">${escapeHtml(task.description || '')}</div>
                    <div class="task-actions">
                        <button class="btn btn-${task.completed ? 'success' : 'primary'}" 
                                onclick="toggleTask(${task.id}, ${!task.completed})">
                            ${task.completed ? '✅ Completed' : '⏳ Mark Complete'}
                        </button>
                        <button class="btn btn-danger" onclick="deleteTask(${task.id})">
                            🗑️ Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Add new task
        async function addTask(title, description) {
            if (!isConnected) {
                showMessage('Backend not connected', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ title, description })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Task added successfully!');
                    taskTitle.value = '';
                    taskDescription.value = '';
                    loadTasks();
                } else {
                    throw new Error(data.error || 'Failed to add task');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        // Toggle task completion
        async function toggleTask(taskId, completed) {
            if (!isConnected) return;

            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ completed })
                });

                if (response.ok) {
                    loadTasks();
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to update task');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        // Delete task
        async function deleteTask(taskId) {
            if (!isConnected) return;
            
            if (!confirm('Are you sure you want to delete this task?')) return;

            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showMessage('Task deleted successfully!');
                    loadTasks();
                } else {
                    const data = await response.json();
                    throw new Error(data.error || 'Failed to delete task');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        // Utility function to escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event listeners
        taskForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const title = taskTitle.value.trim();
            const description = taskDescription.value.trim();
            
            if (title) {
                addTask(title, description);
            }
        });

        // Initialize app
        checkConnection();
        
        // Check connection periodically
        setInterval(checkConnection, 10000);
    </script>
</body>
</html>
